name: Smoke em produção

# Depois de cada deploy e toda segunda às 9h (BRT): o site está no ar, os CTAs apontam para o WhatsApp certo,
# os metadados estão lá, a 404 responde e os links externos (LinkedIn, Instagram, e-mail) continuam válidos.
on:
  workflow_run:
    workflows: [Deploy]
    types: [completed]
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:
    inputs:
      base_url:
        description: URL a testar
        default: https://www.resetia.com.br
        required: true

permissions:
  contents: read

jobs:
  smoke:
    name: Playwright contra produção
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    env:
      BASE_URL: ${{ github.event.inputs.base_url || 'https://www.resetia.com.br' }}
    steps:
      - uses: actions/checkout@v4
      - name: O site no ar é o nosso?
        id: site
        # O domínio pode responder 200 com o site antigo ou uma página de estacionamento; só testamos se o HTML for deste repositório.
        run: |
          html=$(curl -sL --max-time 20 "$BASE_URL/" || true)
          if echo "$html" | grep -q 'data-tom='; then
            echo "http=200" >> "$GITHUB_OUTPUT"
          else
            echo "http=outro" >> "$GITHUB_OUTPUT"
            echo "::notice title=Smoke pulado::$BASE_URL ainda não serve este site (DNS/deploy pendentes). Veja docs/deploy.md."
          fi
      - uses: actions/setup-node@v4
        if: steps.site.outputs.http == '200'
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        if: steps.site.outputs.http == '200'
      - run: npx playwright install --with-deps chromium
        if: steps.site.outputs.http == '200'
      - name: RESET AI Score ligado ao Supabase (sem isso, os leads se perdem)
        if: steps.site.outputs.http == '200'
        run: |
          curl -sL --max-time 20 "$BASE_URL/ai-score/" | grep -q 'data-ai-score-modo="producao"' || {
            echo "::error title=AI Score em modo demonstração::$BASE_URL/ai-score/ foi publicado sem NEXT_PUBLIC_SUPABASE_URL e NEXT_PUBLIC_SUPABASE_ANON_KEY (ver docs/deploy.md)."
            exit 1
          }
      - name: CTAs, SEO e 404 em produção
        if: steps.site.outputs.http == '200'
        run: npx playwright test --project=desktop-chromium tests/e2e/cta-whatsapp.spec.ts tests/e2e/seo.spec.ts tests/e2e/404.spec.ts tests/e2e/ai-score.spec.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: smoke-report
          path: playwright-report
          retention-days: 14

  links-externos:
    name: Links externos (lychee)
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          # wa.me, LinkedIn e Instagram bloqueiam robôs: ficam de fora; o resto é checado de verdade.
          args: --no-progress --accept 200..=204,429,999 --exclude 'wa\.me' --exclude 'linkedin\.com' --exclude 'instagram\.com' --exclude 'cloud\.umami\.is' --exclude 'googletagmanager\.com' 'src/content/*.ts' 'README.md' 'docs/*.md'
          fail: true
