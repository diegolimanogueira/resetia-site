name: Deploy

# Só faz deploy quando o CI da main terminou verde. O app spec (.do/app.yaml) tem deploy_on_push: false.
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      so_conferir:
        description: "Só valida o spec e mostra o custo (doctl apps propose), sem publicar"
        type: boolean
        default: false

concurrency:
  group: deploy-producao
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: DigitalOcean App Platform
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: producao
      url: https://www.resetia.com.br
    steps:
      - uses: actions/checkout@v4
      - name: Verificar token da DigitalOcean
        id: token
        env:
          TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::notice title=Deploy pulado::Secret DIGITALOCEAN_ACCESS_TOKEN ausente. Veja docs/deploy.md."
            echo "pronto=false" >> "$GITHUB_OUTPUT"
          else
            echo "pronto=true" >> "$GITHUB_OUTPUT"
          fi
      # Antes de mudar o spec (componente novo, domínio): rodar este workflow à mão, no branch, com "so_conferir".
      # A DO valida o arquivo e diz se o app continua estático e quanto custa, sem publicar nada.
      - name: Instalar doctl
        if: steps.token.outputs.pronto == 'true' && inputs.so_conferir == true
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      - name: Conferir spec e custo (sem publicar)
        if: steps.token.outputs.pronto == 'true' && inputs.so_conferir == true
        run: |
          APP=$(doctl apps list --format ID,Spec.Name --no-header | awk '$2 == "resetia-site" { print $1 }')
          doctl apps propose --spec .do/app.yaml --app "$APP"
          doctl apps propose --spec .do/app.yaml --app "$APP" --output json
      - name: Deploy (app spec em .do/app.yaml)
        if: steps.token.outputs.pronto == 'true' && inputs.so_conferir != true
        uses: digitalocean/app_action/deploy@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          app_spec_location: .do/app.yaml
          print_build_logs: "true"
          print_deploy_logs: "true"
