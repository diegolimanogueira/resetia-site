name: Keep-alive do Supabase

# O plano gratuito do Supabase pausa o projeto depois de 7 dias sem atividade, e aí os leads do RESET AI Score
# deixam de ser gravados (o site guarda e reenvia depois, mas só quando a pessoa volta). A cada dois dias este
# workflow chama a função public.ping() com a chave anônima. Se falhar, o GitHub avisa por e-mail.
# Precisa das variáveis do repositório NEXT_PUBLIC_SUPABASE_URL e NEXT_PUBLIC_SUPABASE_ANON_KEY
# (Settings → Secrets and variables → Actions → Variables). Sem elas, o job só registra um aviso.
on:
  schedule:
    - cron: "17 11 */2 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      CHAVE: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - name: Chamar public.ping()
        run: |
          if [ -z "$URL" ] || [ -z "$CHAVE" ]; then
            echo "::warning title=Keep-alive sem configuração::defina as variáveis NEXT_PUBLIC_SUPABASE_URL e NEXT_PUBLIC_SUPABASE_ANON_KEY no repositório."
            exit 0
          fi
          status=$(curl -s -o resposta.txt -w '%{http_code}' -X POST "${URL%/}/rest/v1/rpc/ping" \
            -H "apikey: $CHAVE" -H "Authorization: Bearer $CHAVE" -H "Content-Type: application/json" -d '{}')
          echo "HTTP $status: $(cat resposta.txt)"
          [ "$status" = "200" ] || { echo "::error title=Supabase não respondeu::o projeto pode estar pausado. Restaure no painel."; exit 1; }
