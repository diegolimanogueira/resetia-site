name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 24
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  qualidade:
    name: Lint, formato, tipos, código morto, unidade
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run knip
      - run: npm run test

  build:
    name: Build estático e checagens do out/
    runs-on: ubuntu-latest
    needs: qualidade
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: HTML válido
        run: npm run check:html
      - name: Peso dos bundles
        run: npm run check:size
      - name: Pendências [FALTA] (aviso, não falha)
        run: npm run check:falta
      - name: Links internos e âncoras (lychee, offline)
        uses: lycheeverse/lychee-action@v2
        with:
          # --index-files: /rota/#ancora abre out/rota/index.html para achar a âncora (links entre páginas com fragmento).
          lycheeVersion: v0.24.2
          args: --offline --root-dir ${{ github.workspace }}/out --index-files index.html --include-fragments --exclude '\?' --no-progress 'out/**/*.html'
          fail: true
      - uses: actions/upload-artifact@v4
        with:
          name: out
          path: out
          retention-days: 7

  e2e:
    name: Playwright (E2E, axe, visual)
    runs-on: ubuntu-latest
    needs: build
    # Mesma imagem usada para gerar os baselines (npm run e2e:baselines): fontes e renderização idênticas.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: out
          path: out
      - run: npm run e2e
        env:
          HOME: /root
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14

  lighthouse:
    name: Lighthouse CI (mobile)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: out
          path: out
      - run: npm run lhci
        env:
          LHCI_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse
          path: .lighthouseci
          retention-days: 14
