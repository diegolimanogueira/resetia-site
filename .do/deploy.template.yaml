# Template do botão "Deploy to DigitalOcean" (README). Cria o app com um clique no painel.
# Domínios e redirect são adicionados depois pelo spec completo em .do/app.yaml (deploy.yml) ou no painel.
spec:
  name: resetia-site
  region: nyc
  static_sites:
    - name: site
      github:
        repo: diegolimanogueira/resetia-site
        branch: main
        deploy_on_push: true
      environment_slug: node-js
      build_command: npm ci && npm run build
      output_dir: out
      index_document: index.html
      error_document: 404.html
      envs:
        - key: NEXT_PUBLIC_SITE_URL
          scope: BUILD_TIME
          value: https://www.resetia.com.br
        - key: NEXT_TELEMETRY_DISABLED
          scope: BUILD_TIME
          value: "1"
